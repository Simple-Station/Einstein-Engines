# Vertical-slice jobs (12 of the GDD's 36). Starting gear, job icons and access levels are borrowed
# from existing station jobs as placeholders; they get swapped for kingdom items (royal seals,
# satchels, healer's kits) once those exist. Access levels keep their station names for now.

# --- Tier I: The Crown ---

- type: job
  id: WoFQueen
  name: wof-job-name-queen
  description: wof-job-description-queen
  playTimeTracker: WoFJobQueen
  weight: 20
  startingGear: CaptainGear
  icon: "JobIconCaptain"
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: wof-job-supervisors-none
  canBeAntag: false
  accessGroups:
  - AllAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: job
  id: WoFRoyalAdvisor
  name: wof-job-name-royal-advisor
  description: wof-job-description-royal-advisor
  playTimeTracker: WoFJobRoyalAdvisor
  weight: 10
  startingGear: HoPGear
  icon: "JobIconHeadOfPersonnel"
  supervisors: wof-job-supervisors-queen
  canBeAntag: false
  access:
  - Command
  - HeadOfPersonnel
  - Service
  - Kitchen
  - Hydroponics
  - Bar
  - Cargo
  - Maintenance
  - External

