# Placeholder dragon markings. They reuse the CC-BY-SA reptilian and harpy RSIs already in the repo
# so the slice is playable before original dragon art exists.

# Wings (drawn on the right arm layer, like harpy wings, so the flight flap animation finds them)
- type: marking
  id: WoFDragonWingsMembrane
  bodyPart: RArm
  markingCategory: RightArm
  speciesRestriction: [RainWing, NightWing, MudWing]
  sprites:
  - sprite: Mobs/Customization/Harpy/harpy_wings.rsi
    state: bat_wings_tone_1
  - sprite: Mobs/Customization/Harpy/harpy_wings.rsi
    state: bat_wings_tone_2

