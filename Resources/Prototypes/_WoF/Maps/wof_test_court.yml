# Test map for the vertical slice: an existing small station with only the kingdom jobs enabled.
# Players without a job spawn point fall back to any spawn point, so no mapping is needed to test.
# Replace with the Rainforest Court map once it exists.
# To use it, set the server cvar:  game.map_pool = "WoFSliceMapPool"

- type: gameMap
  id: WoFTestCourt
  mapName: 'Test Court'
  mapPath: /Maps/pebble.yml
  minPlayers: 0
  maxPlayers: 40
  stations:
    WoFTestCourtStation:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: 'The Rainforest Court'
        - type: StationJobs
          availableJobs:
            WoFQueen: [ 1, 1 ]
            WoFRoyalAdvisor: [ 1, 1 ]
            WoFCaptainOfTheGuard: [ 1, 1 ]
            WoFRoyalGuard: [ 2, 4 ]
            WoFMasterOfStores: [ 1, 1 ]
            WoFFarmer: [ 2, 3 ]
            WoFHunter: [ 1, 2 ]
            WoFRoyalCook: [ 1, 2 ]
            WoFChiefHealer: [ 1, 1 ]
            WoFHealer: [ 2, 3 ]
            WoFMerchant: [ 1, 3 ]
            WoFCitizen: [ -1, -1 ]

- type: gameMapPool
  id: WoFSliceMapPool
  maps:
  - WoFTestCourt
