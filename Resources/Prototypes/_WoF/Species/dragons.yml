# Vertical-slice tribes: RainWing, NightWing, MudWing.
# All three borrow reptilian body sprites and lizard/bat-wing markings as placeholders until
# original dragon sprites are drawn. Do not trace official Wings of Fire art for the replacements.

- type: species
  id: RainWing
  name: species-name-rainwing
  roundStart: true
  prototype: WoFMobRainWing
  sprites: WoFDragonSprites
  defaultSkinTone: "#3fbf6f"
  markingLimits: WoFDragonMarkingLimits
  dollPrototype: WoFMobRainWingDummy
  skinColoration: Hues
  maleFirstNames: WoFNamesRainWing
  femaleFirstNames: WoFNamesRainWing
  naming: First
  minAge: 6
  youngAge: 10
  oldAge: 60
  maxAge: 120
  minHeight: 0.8
  defaultHeight: 1.0
  maxHeight: 1.2
  minWidth: 0.75
  defaultWidth: 0.95
  maxWidth: 1.2

